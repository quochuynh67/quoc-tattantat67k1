<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <!-- Road -->
  <rect id="road" x="0" y="155" width="340" height="65" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Sky -->
  <rect id="sky" x="0" y="0" width="340" height="155" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Car body lower -->
  <rect id="car-body" x="50" y="100" width="240" height="60" rx="12" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Car body upper (cabin) -->
  <path id="car-cabin" d="M 110 100 L 130 55 L 240 55 L 265 100 Z" fill="#ffffff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path id="windshield" d="M 195 62 L 210 62 L 255 97 L 195 97 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Side window -->
  <path id="side-window" d="M 138 62 L 188 62 L 188 97 L 120 97 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Front headlight -->
  <rect id="headlight-front" x="280" y="115" width="15" height="12" rx="3" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Rear light -->
  <rect id="light-rear" x="46" y="115" width="12" height="12" rx="3" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Front wheel -->
  <circle id="wheel-front" cx="240" cy="160" r="24" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <circle cx="240" cy="160" r="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Rear wheel -->
  <circle id="wheel-rear" cx="100" cy="160" r="24" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <circle cx="100" cy="160" r="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Door handle -->
  <rect x="155" y="118" width="20" height="4" rx="2" fill="none" stroke="#222" stroke-width="2"/>
  <!-- Sun -->
  <circle id="car-sun" cx="300" cy="35" r="20" fill="#ffffff" stroke="#222" stroke-width="2"/>
</svg>
