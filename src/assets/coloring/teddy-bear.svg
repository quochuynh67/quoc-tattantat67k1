<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="100%" height="100%">
  <!-- Background panel -->
  <rect id="bear-bg" x="0" y="0" width="260" height="280" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Left Ear Outer -->
  <circle id="ear-left-outer" cx="75" cy="70" r="24" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Left Ear Inner -->
  <circle id="ear-left-inner" cx="75" cy="70" r="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Right Ear Outer -->
  <circle id="ear-right-outer" cx="185" cy="70" r="24" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Right Ear Inner -->
  <circle id="ear-right-inner" cx="185" cy="70" r="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Main Head -->
  <circle id="bear-head" cx="130" cy="110" r="50" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Muzzle/Snout -->
  <ellipse id="bear-snout" cx="130" cy="125" rx="18" ry="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Nose -->
  <polygon id="bear-nose" points="123,120 137,120 130,127" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Left Eye -->
  <circle id="eye-left" cx="112" cy="100" r="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <circle cx="112" cy="99" r="2.5" fill="#000000"/>
  <!-- Right Eye -->
  <circle id="eye-right" cx="148" cy="100" r="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <circle cx="148" cy="99" r="2.5" fill="#000000"/>
  <!-- Body -->
  <ellipse id="bear-body" cx="130" cy="200" rx="42" ry="46" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Tummy patch -->
  <circle id="bear-tummy" cx="130" cy="205" r="26" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Left Arm -->
  <ellipse id="arm-left" cx="72" cy="180" rx="16" ry="24" fill="#ffffff" stroke="#222" stroke-width="3" transform="rotate(-30 72 180)"/>
  <!-- Right Arm -->
  <ellipse id="arm-right" cx="188" cy="180" rx="16" ry="24" fill="#ffffff" stroke="#222" stroke-width="3" transform="rotate(30 188 180)"/>
  <!-- Left Foot -->
  <circle id="foot-left" cx="95" cy="245" r="22" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Right Foot -->
  <circle id="foot-right" cx="165" cy="245" r="22" fill="#ffffff" stroke="#222" stroke-width="3"/>
</svg>
