<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" width="100%" height="100%">
  <!-- Space background -->
  <rect id="space" x="0" y="0" width="280" height="340" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Rocket body -->
  <path id="rocket-body" d="M 140 30 C 100 80 95 180 95 250 L 185 250 C 185 180 180 80 140 30 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Nose cone stripe -->
  <path id="nose-stripe" d="M 140 30 C 125 55 118 85 115 100 L 165 100 C 162 85 155 55 140 30 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Window (porthole) -->
  <circle id="window" cx="140" cy="140" r="22" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <circle id="window-inner" cx="140" cy="140" r="14" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Left fin -->
  <path id="fin-left" d="M 95 200 L 55 270 L 55 290 L 95 250 Z" fill="#ffffff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right fin -->
  <path id="fin-right" d="M 185 200 L 225 270 L 225 290 L 185 250 Z" fill="#ffffff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bottom base -->
  <rect id="rocket-base" x="95" y="245" width="90" height="15" rx="3" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Flame outer -->
  <path id="flame-outer" d="M 110 260 C 110 290 125 320 140 330 C 155 320 170 290 170 260 Z" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Flame inner -->
  <path id="flame-inner" d="M 125 260 C 125 280 133 305 140 310 C 147 305 155 280 155 260 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Star decorations -->
  <polygon id="deco-star1" points="40,50 44,62 57,62 47,70 50,82 40,74 30,82 33,70 23,62 36,62" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <polygon id="deco-star2" points="240,80 244,92 257,92 247,100 250,112 240,104 230,112 233,100 223,92 236,92" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <polygon id="deco-star3" points="50,280 53,289 62,289 55,295 57,304 50,298 43,304 45,295 38,289 47,289" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <!-- Planet -->
  <circle id="planet" cx="235" cy="180" r="16" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <ellipse cx="235" cy="180" rx="26" ry="6" fill="none" stroke="#222" stroke-width="1.5" transform="rotate(-20 235 180)"/>
</svg>
