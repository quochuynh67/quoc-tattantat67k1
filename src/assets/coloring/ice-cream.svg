<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <!-- Background sky -->
  <rect id="ice-sky" x="0" y="0" width="240" height="320" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Cone base -->
  <polygon id="cone-base" points="120,300 50,160 190,160" fill="#ffffff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cone waffle pattern lines -->
  <line id="waffle-l1" x1="75" y1="210" x2="165" y2="210" stroke="#222" stroke-width="2"/>
  <line id="waffle-l2" x1="95" y1="250" x2="145" y2="250" stroke="#222" stroke-width="2"/>
  <!-- Scoop 1 (Bottom Scoop) -->
  <path id="scoop-bottom" d="M 50 160 C 30 160 30 110 70 105 C 90 60 150 60 170 105 C 210 110 210 160 190 160 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Scoop 2 (Top Scoop) -->
  <path id="scoop-top" d="M 65 110 C 50 110 50 65 85 55 C 105 25 145 25 160 55 C 190 65 190 110 175 110 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Cherry topping -->
  <circle id="cherry" cx="120" cy="30" r="16" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Cherry stem -->
  <path id="cherry-stem" d="M 120 14 C 130 5 145 10 140 2" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sprinkles components -->
  <rect id="sprinkle1" x="90" y="70" width="14" height="6" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.8" transform="rotate(25 90 70)"/>
  <rect id="sprinkle2" x="130" y="60" width="14" height="6" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.8" transform="rotate(-30 130 60)"/>
  <rect id="sprinkle3" x="80" y="125" width="14" height="6" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.8" transform="rotate(-15 80 125)"/>
  <rect id="sprinkle4" x="145" y="120" width="14" height="6" rx="3" fill="#ffffff" stroke="#222" stroke-width="1.8" transform="rotate(40 145 120)"/>
</svg>
