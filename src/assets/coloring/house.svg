<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <!-- Sky background -->
  <rect id="sky-bg" x="0" y="0" width="320" height="180" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Ground -->
  <rect id="ground" x="0" y="180" width="320" height="100" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Sun -->
  <circle id="sun" cx="270" cy="50" r="28" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Cloud -->
  <path id="cloud" d="M 50 55 C 40 30 80 20 90 40 C 95 25 130 30 125 50 C 140 45 145 65 130 70 L 45 70 C 30 70 30 55 50 55 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- House Wall -->
  <rect id="wall" x="80" y="110" width="160" height="110" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- Roof -->
  <polygon id="roof" points="60,115 160,30 260,115" fill="#ffffff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- Door -->
  <rect id="door" x="140" y="155" width="40" height="65" rx="3" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Door Knob -->
  <circle id="doorknob" cx="172" cy="190" r="4" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Left Window -->
  <rect id="window-left" x="95" y="135" width="30" height="30" rx="3" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Right Window -->
  <rect id="window-right" x="195" y="135" width="30" height="30" rx="3" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Chimney -->
  <rect id="chimney" x="200" y="40" width="25" height="55" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Tree Trunk -->
  <rect id="tree-trunk" x="28" y="140" width="18" height="55" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <!-- Tree Crown -->
  <circle id="tree-crown" cx="37" cy="125" r="30" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- Path to door -->
  <path id="walkpath" d="M 135 220 L 150 260 L 170 260 L 185 220 Z" fill="#ffffff" stroke="#222" stroke-width="2"/>
</svg>
